version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: t-pms-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tpms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: t-pms-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: